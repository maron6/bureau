[package]
name = "tui"
version = "0.1.0"  
edition = "2021"

[[bin]]
name = "bureau-tui"
path = "src/main.rs" 

[dependencies]
# Depends on bureau-lib domain types from our workspace member  
bureau-lib = { path = "../bureau-lib" }

# TUI dependencies (only bin crate needs these)
anyhow = "1"
ratatui = "0.29"  
crossterm = "0.28" 
