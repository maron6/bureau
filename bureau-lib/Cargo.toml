[package]
name = "bureau-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
# Config & serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"

# HTTP LLM provider (used by agent module)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "streaming"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# Utilities
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
glob = "0.3"
rand = "0.8"
dirs = "5"

[dev-dependencies]
tempfile = "3"
